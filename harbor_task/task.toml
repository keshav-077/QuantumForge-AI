version = "1.0"

[metadata]
name = "cryoforge-rl-commissioning"
title = "AgentBreak Bench (CryoForge): Multi-Constraint Operations & Supply-Shock Adaptation"
author_name = "AgentBreak Bench Contributors"
author_email = "maintainers@agentbreak-bench.dev"
difficulty = "hard"
category = "industrial-engineering-planning"
tags = [
    "mcp",
    "cryogenics",
    "mechanical-design",
    "scheduling",
    "logistics",
    "supply-chain-disruption",
    "opencode",
    "harbor",
]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "public"

[[environment.mcp_servers]]
name = "cryoforge"
transport = "sse"
url = "http://cryoforge-mcp:8090/sse"
