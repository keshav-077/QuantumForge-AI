<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Disruption recovery timeline</title>
  <desc id="desc">A twelve-week lane schedule compares a successful reroute with a failed plan after a lane outage in weeks six and seven.</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="100" y="105" fill="#4f46e5" font-size="18" font-weight="700" letter-spacing="3">FIGURE 03 · DISRUPTION RECOVERY</text>
    <text x="100" y="165" fill="#18181b" font-size="44" font-weight="700" letter-spacing="-1.5">Same outage. Two very different recoveries.</text>
    <text x="100" y="205" fill="#71717a" font-size="20">The reference agent reroutes; the frontier plan collides with the updated environment.</text>
    <g transform="translate(100 285)">
      <rect width="1400" height="440" rx="28" fill="#fafafa" stroke="#e4e4e7" stroke-width="2"/>
      <g transform="translate(210 42)" fill="#71717a" font-size="13" font-weight="600">
        <text x="0" y="0">W1</text><text x="88" y="0">W2</text><text x="176" y="0">W3</text><text x="264" y="0">W4</text>
        <text x="352" y="0">W5</text><text x="440" y="0">W6</text><text x="528" y="0">W7</text><text x="616" y="0">W8</text>
        <text x="704" y="0">W9</text><text x="792" y="0">W10</text><text x="880" y="0">W11</text><text x="968" y="0">W12</text>
      </g>
      <g transform="translate(190 62)">
        <g stroke="#e4e4e7"><path d="M0 0v320M88 0v320M176 0v320M264 0v320M352 0v320M440 0v320M528 0v320M616 0v320M704 0v320M792 0v320M880 0v320M968 0v320M1056 0v320"/></g>
        <rect x="440" width="176" height="320" fill="#fff1f2"/>
        <path d="M440 0v320M616 0v320" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 7"/>
        <text x="494" y="22" fill="#e11d48" font-size="12" font-weight="700">LANE B OUT</text>
      </g>
      <g transform="translate(28 82)">
        <text x="0" y="31" fill="#18181b" font-size="16" font-weight="700">REFERENCE</text>
        <text x="0" y="55" fill="#059669" font-size="12" font-weight="700">4 / 4 VALID</text>
        <text x="0" y="90" fill="#71717a" font-size="14">Lane A</text>
        <text x="0" y="162" fill="#71717a" font-size="14">Lane B</text>
        <g transform="translate(162 60)">
          <rect width="264" height="45" rx="10" fill="#4f46e5"/><text x="18" y="29" fill="#fff" font-size="14" font-weight="700">J1 · priority delivery</text>
          <rect x="352" width="352" height="45" rx="10" fill="#818cf8"/><text x="370" y="29" fill="#fff" font-size="14" font-weight="700">J3 · rerouted batch</text>
          <rect x="88" y="72" width="264" height="45" rx="10" fill="#059669"/><text x="106" y="101" fill="#fff" font-size="14" font-weight="700">J2 · transfer</text>
          <rect x="616" y="72" width="264" height="45" rx="10" fill="#34d399"/><text x="634" y="101" fill="#052e26" font-size="14" font-weight="700">J4 · final SLA</text>
        </g>
      </g>
      <path d="M28 275h1344" stroke="#e4e4e7" stroke-width="2"/>
      <g transform="translate(28 295)">
        <text x="0" y="31" fill="#18181b" font-size="16" font-weight="700">FRONTIER</text>
        <text x="0" y="55" fill="#e11d48" font-size="12" font-weight="700">2 / 4 VALID</text>
        <g transform="translate(162 10)">
          <rect x="352" width="352" height="45" rx="10" fill="#e11d48"/><path d="m370 15 15 15m0-15-15 15" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="396" y="29" fill="#fff" font-size="14" font-weight="700">J2 · overlaps outage</text>
        </g>
      </g>
    </g>
    <g transform="translate(100 770)">
      <circle cx="10" cy="10" r="10" fill="#4f46e5"/><text x="32" y="16" fill="#52525b" font-size="15">Reference schedule</text>
      <circle cx="240" cy="10" r="10" fill="#e11d48"/><text x="262" y="16" fill="#52525b" font-size="15">Invalid frontier allocation</text>
      <rect x="526" width="20" height="20" fill="#fff1f2" stroke="#fb7185"/><text x="560" y="16" fill="#52525b" font-size="15">Environment outage</text>
    </g>
  </g>
</svg>
